[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "spires-postprocess"
dynamic = ["version"]  # version derived from git tags via setuptools_scm
description = "SPIReS postprocessing: canopy, ice, cloud gap-fill, and inpainting"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "xarray", "canopy", "glacier ice", "inpainting"]
dependencies = [
    "spires-contract @ git+https://github.com/SPIReS-Organization/spires-contract.git@main",
    "numpy",
    "xarray",
    "scipy",
    "rioxarray",
]

[project.optional-dependencies]
# In-process LaMa tree-fill backend (spires_postprocess.treefill_lama). Torch only; the
# TorchScript weights are fetched into torch's hub cache and verified by sha256.
treefill = ["torch>=2.3.0"]
test = ["pytest"]
# In-process OmniCloudMask reference backend (spires_postprocess.cloudmask). Pinned: the
# mask must be reproducible from the repo + this extra alone. Valid for 10-50 m sensors only.
cloudmask = ["omnicloudmask==1.7.1", "torch>=2.3.0"]

[project.urls]
Homepage = "https://github.com/SPIReS-Organization/spires-postprocess"
Repository = "https://github.com/SPIReS-Organization/spires-postprocess"

[tool.setuptools.packages.find]
where = ["./"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["./"]
markers = ["slow: needs model weights and minutes of CPU"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
